name: GitHub Readme Terminal

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Nostromo Terminal
        uses: x0rzavi/github-readme-terminal@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Hijack the default "yoru" theme and force the Nostromo color palette
          GIFOS_YORU_DEFAULT_COLORS_BG: "#050505"
          GIFOS_YORU_DEFAULT_COLORS_FG: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_BLACK: "#050505"
          GIFOS_YORU_NORMAL_COLORS_RED: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_GREEN: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_YELLOW: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_BLUE: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_MAGENTA: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_CYAN: "#39ff14"
          GIFOS_YORU_NORMAL_COLORS_WHITE: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_BLACK: "#050505"
          GIFOS_YORU_BRIGHT_COLORS_RED: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_GREEN: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_YELLOW: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_BLUE: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_MAGENTA: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_CYAN: "#39ff14"
          GIFOS_YORU_BRIGHT_COLORS_WHITE: "#39ff14"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-readme-terminal.gif
          git commit -m "Update Nostromo Terminal animation" || echo "No changes to commit"
          git push
